# Webserv Configuration File
# Inspired by NGINX configuration syntax

# First server block - main website
server {
    listen 0.0.0.0:8080;
    server_name localhost;

    # Maximum client body size (1MB)
    client_max_body_size 1M;

    # Custom error pages
    error_page 404 /errors/404.html;
    error_page 500 /errors/500.html;

    # Default root directory
    root www;

    # Root location
    location / {
        allow_methods GET POST DELETE;
        index index.html;
        autoindex off;
    }

    # Upload location
    location /upload {
        allow_methods POST DELETE;
        upload_path www/uploads;
        autoindex on;
    }

    # CGI location for PHP
    location /cgi-bin {
        allow_methods GET POST;
        root www/cgi-bin;
        cgi_extension .php /usr/bin/php-cgi;
        cgi_extension .py /usr/bin/python3;
    }

    # Static files with directory listing
    location /files {
        allow_methods GET;
        root www/files;
        autoindex on;
    }

    # Redirect example
    location /old-page {
        return /new-page.html;
    }
}

# Second server block - alternative port
server {
    listen 0.0.0.0:8081;
    server_name webserv-alt;

    client_max_body_size 5M;

    error_page 404 /errors/404.html;

    root www;

    location / {
        allow_methods GET;
        index index.html;
        autoindex off;
    }
}

# Third server block - API endpoint example
server {
    listen 0.0.0.0:8082;
    server_name api.webserv;

    client_max_body_size 10M;

    root www/api;

    location /api {
        allow_methods GET POST PUT DELETE;
        autoindex off;
    }
}
